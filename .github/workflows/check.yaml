name: Check

# make check: what must pass before a change lands in main
# On main, Release runs this before it releases.
on:
  pull_request:
    # What tagpr's pull request changes, released only once this passes on
    # main
    paths-ignore:
      - CHANGELOG.md
      - internal/version/version.go
  workflow_dispatch:
  workflow_call:

jobs:
  check:
    strategy:
      matrix:
        os: ['ubuntu-latest', 'macos-latest']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      # golangci-lint, pinned in mise.toml
      - uses: jdx/mise-action@6be3c7ed4c21d4f76b208d351d95aac273ebb76d # v5.2.4
        with:
          version: 2026.9.18
      - run: make check
